<div class="flex flex-col gap-4 border-b border-app-border pb-6 sm:flex-row sm:items-end sm:justify-between">
  <div class="max-w-3xl">
    @if (eyebrow()) {
      <p class="text-[11px] uppercase tracking-[0.3em] text-app-muted">{{ eyebrow() }}</p>
    }
    <h2 class="mt-2 text-3xl font-semibold tracking-[-0.03em] text-app-text">{{ title() }}</h2>
    @if (description()) {
      <p class="mt-3 text-sm leading-7 text-app-muted">{{ description() }}</p>
    }
  </div>
  <div class="flex items-center gap-2">
    <ng-content />
  </div>
</div>
