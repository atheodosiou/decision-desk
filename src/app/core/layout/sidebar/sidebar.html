<nav aria-label="Primary navigation" class="flex h-full flex-col">
  <div class="flex-1 space-y-5">
    @for (group of groups(); track group.title) {
      <div>
        <p class="mb-2.5 px-2 text-[10px] font-semibold uppercase tracking-[0.3em] text-app-muted-2">{{ group.title }}</p>
        <ul class="space-y-1">
          @for (item of group.items; track item.route) {
            <li>
              <a
                [routerLink]="item.route"
                routerLinkActive="bg-accent-soft text-accent"
                [routerLinkActiveOptions]="{ exact: false }"
                class="flex items-center gap-3 rounded-2xl px-3 py-2 text-sm font-medium text-app-muted transition hover:bg-app-surface-2 hover:text-app-text"
                (click)="itemSelected.emit()"
              >
                <span class="flex h-8 w-8 items-center justify-center rounded-full bg-app-surface-2 text-[13px]">{{ item.icon }}</span>
                <span>{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </div>

  <div class="mt-5 rounded-[18px] border border-app-border-soft bg-app-surface-2 p-3.5">
    <p class="text-[10px] font-semibold uppercase tracking-[0.26em] text-app-muted">Process discipline</p>
    <p class="mt-2 text-sm font-semibold text-app-text">Complete valuation first</p>
    <p class="mt-1.5 text-sm leading-6 text-app-muted">Keep thesis, size, and bear case explicit before any decision.</p>
  </div>
</nav>
