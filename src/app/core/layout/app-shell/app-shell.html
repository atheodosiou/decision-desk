<div class="min-h-screen bg-app-bg text-app-text">
  <div class="mx-auto flex min-h-screen max-w-[1580px]">
    <aside class="hidden w-[272px] shrink-0 border-r border-app-border bg-app-bg/95 lg:flex lg:flex-col lg:sticky lg:top-0 lg:h-screen">
      <div class="flex h-full flex-col px-5 py-5">
        <div class="mb-7 border-b border-app-border/70 pb-4">
          <p class="text-[11px] font-semibold uppercase tracking-[0.32em] text-app-muted">Decision Desk</p>
          <p class="mt-2 text-[11px] uppercase tracking-[0.24em] text-app-muted-2">Thinking before action</p>
        </div>
        <div class="flex-1">
          <app-sidebar [items]="navigationItems" />
        </div>
      </div>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <header class="flex items-center justify-between border-b border-app-border bg-app-bg/90 px-4 py-4 backdrop-blur lg:hidden">
        <div>
          <p class="text-[11px] uppercase tracking-[0.3em] text-app-muted">Decision Desk</p>
          <p class="text-sm font-medium text-app-text">What needs thinking?</p>
        </div>
        <button
          type="button"
          class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-app-border bg-app-surface-2 text-app-text"
          (click)="toggleMobileNav()"
          aria-label="Toggle navigation"
        >
          ☰
        </button>
      </header>

      @if (isMobileNavOpen()) {
        <div class="border-b border-app-border bg-app-surface px-4 py-4 lg:hidden">
          <app-sidebar [items]="navigationItems" (itemSelected)="closeMobileNav()" />
        </div>
      }

      <main class="flex-1 px-4 py-4 sm:px-6 sm:py-6 lg:px-6 lg:py-6">
        <div class="mx-auto w-full max-w-[1580px]">
          <router-outlet />
        </div>
      </main>
    </div>
  </div>
</div>
